    /* =====================================================

<body>


  <!-- =====================================================
       FUNDO
       ===================================================== -->

  <div class="background">

    <div class="circle circle-1"></div>

    <div class="circle circle-2"></div>

  </div>


  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <main class="login-container">

    <section class="login-card">


      <!-- LOGO -->

      <div class="logo-area">

        <div class="logo">
          🚚
        </div>

        <div class="titulo">
          Biri<span>Log</span>
        </div>

        <div class="subtitulo">
          Sistema de Controle Logístico
        </div>

        <div class="empresa">
          BIRIVET • V3.0
        </div>

      </div>


      <!-- MENSAGEM -->

      <div
        id="mensagem"
        class="mensagem"
      ></div>


      <!-- FORMULÁRIO -->

      <form
        id="formLogin"
        class="formulario"
        onsubmit="realizarLogin(event)"
      >


        <!-- E-MAIL -->

        <div class="campo">

          <label
            class="label"
            for="email"
          >
            E-mail
          </label>

          <div class="input-wrapper">

            <span class="icone">
              ✉️
            </span>

            <input
              type="email"
              id="email"
              placeholder="DIGITE SEU E-MAIL"
              autocomplete="username"
              required
            >

          </div>

        </div>


        <!-- SENHA -->

        <div class="campo">

          <label
            class="label"
            for="senha"
          >
            Senha
          </label>

          <div class="input-wrapper">

            <span class="icone">
              🔒
            </span>

            <input
              type="password"
              id="senha"
              placeholder="DIGITE SUA SENHA"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="botao-senha"
              id="botaoSenha"
              onclick="alternarSenha()"
              aria-label="Mostrar senha"
            >
              👁️
            </button>

          </div>

        </div>


        <!-- BOTÃO -->

        <button
          type="submit"
          id="botaoLogin"
          class="botao-login"
        >

          🔐 ENTRAR NO BIRILOG

        </button>


        <!-- LOADING -->

        <div
          id="loading"
          class="loading"
        >

          <span class="spinner"></span>

          <span>
            AUTENTICANDO...
          </span>

        </div>


      </form>


      <!-- RODAPÉ -->

      <div class="rodape">

        <strong>BIRILOG V3</strong>

        <br>

        SISTEMA DE CONTROLE DE ENVIOS

        <br>

        BIRIVET • TODOS OS DIREITOS RESERVADOS

      </div>


    </section>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       CONFIGURAÇÃO SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://sjfwjwwkomrcalahqanw.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_WpXZ79UY0pOqbbpFmJDcdQ_wkYQZLZC";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       LOGIN
       ===================================================== */

    async function realizarLogin(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const senha =
        document
          .getElementById("senha")
          .value;


      esconderMensagem();


      if (!email) {

        mostrarMensagem(
          "DIGITE SEU E-MAIL.",
          "erro"
        );

        return;

      }


      if (!senha) {

        mostrarMensagem(
          "DIGITE SUA SENHA.",
          "erro"
        );

        return;

      }


      iniciarCarregamento();


      try {


        /* =================================================
           AUTENTICAÇÃO SUPABASE
           ================================================= */

        const resultado =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: senha

          });


        if (resultado.error) {

          throw resultado.error;

        }


        const usuario =
          resultado.data.user;


        if (!usuario) {

          throw new Error(
            "USUÁRIO NÃO ENCONTRADO."
          );

        }


        /* =================================================
           VERIFICAR USUÁRIO NO BIRILOG
           ================================================= */

        const consulta =
          await supabaseClient

            .from("usuarios")

            .select(
              "id, nome, email, perfil, ativo"
            )

            .eq(
              "auth_id",
              usuario.id
            )

            .maybeSingle();


        if (consulta.error) {

          throw consulta.error;

        }


        if (!consulta.data) {

          await supabaseClient.auth.signOut();

          throw new Error(
            "USUÁRIO NÃO ESTÁ CADASTRADO NO BIRILOG."
          );

        }


        if (!consulta.data.ativo) {

          await supabaseClient.auth.signOut();

          throw new Error(
            "ESTE USUÁRIO ESTÁ INATIVO."
          );

        }


        /* =================================================
           LOGIN OK
           ================================================= */

        mostrarMensagem(
          "LOGIN REALIZADO COM SUCESSO!",
          "sucesso"
        );


        /* =================================================
           IR PARA DASHBOARD
           ================================================= */

        setTimeout(
          function() {

            window.location.href =
              "dashboard.html";

          },
          700
        );


      }

      catch (erro) {

        console.error(
          "Erro no login:",
          erro
        );


        let mensagem =
          "NÃO FOI POSSÍVEL REALIZAR O LOGIN.";


        if (erro && erro.message) {

          const texto =
            erro.message.toLowerCase();


          if (
            texto.includes(
              "invalid login credentials"
            )
          ) {

            mensagem =
              "E-MAIL OU SENHA INCORRETOS.";

          }

          else if (
            texto.includes(
              "email not confirmed"
            )
          ) {

            mensagem =
              "O E-MAIL DESTE USUÁRIO AINDA NÃO FOI CONFIRMADO.";

          }

          else {

            mensagem =
              erro.message;

          }

        }


        mostrarMensagem(
          mensagem.toUpperCase(),
          "erro"
        );

      }


      finally {

        finalizarCarregamento();

      }

    }


    /* =====================================================
       MOSTRAR / OCULTAR SENHA
       ===================================================== */

    function alternarSenha() {

      const campo =
        document.getElementById("senha");


      const botao =
        document.getElementById("botaoSenha");


      if (
        campo.type === "password"
      ) {

        campo.type =
          "text";

        botao.textContent =
          "🙈";

        botao.setAttribute(
          "aria-label",
          "Ocultar senha"
        );

      }

      else {

        campo.type =
          "password";

        botao.textContent =
          "👁️";

        botao.setAttribute(
          "aria-label",
          "Mostrar senha"
        );

      }

    }


    /* =====================================================
       CARREGAMENTO
       ===================================================== */

    function iniciarCarregamento() {

      document
        .getElementById("botaoLogin")
        .disabled = true;


      document
        .getElementById("botaoLogin")
        .textContent =
        "🔄 AUTENTICANDO...";


      document
        .getElementById("loading")
        .style.display =
        "flex";

    }


    function finalizarCarregamento() {

      document
        .getElementById("botaoLogin")
        .disabled = false;


      document
        .getElementById("botaoLogin")
        .textContent =
        "🔐 ENTRAR NO BIRILOG";


      document
        .getElementById("loading")
        .style.display =
        "none";

    }


    /* =====================================================
       MENSAGENS
       ===================================================== */

    function mostrarMensagem(
      texto,
      tipo
    ) {

      const elemento =
        document.getElementById(
          "mensagem"
        );


      elemento.textContent =
        texto;


      elemento.className =
        "mensagem " + tipo;


      elemento.style.display =
        "block";

    }


    function esconderMensagem() {

      const elemento =
        document.getElementById(
          "mensagem"
        );


      elemento.textContent =
        "";


      elemento.className =
        "mensagem";


      elemento.style.display =
        "none";

    }


    /* =====================================================
       VERIFICAR SESSÃO EXISTENTE
       ===================================================== */

    async function verificarSessao() {

      try {

        const resultado =
          await supabaseClient.auth.getSession();


        if (
          resultado.data &&
          resultado.data.session
        ) {

          window.location.href =
            "dashboard.html";

        }

      }

      catch (erro) {

        console.error(
          "Erro ao verificar sessão:",
          erro
        );

      }

    }


    /* =====================================================
       INICIALIZAÇÃO
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        verificarSessao();

        document
          .getElementById("email")
          .focus();

      }
    );


  </script>


</body>

</html>
