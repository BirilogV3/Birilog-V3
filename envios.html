  <script>

    (function() {

      try {

        const url =
          new URL(window.location.href);

        if (
          !url.searchParams.has("_v")
        ) {

          url.searchParams.set(
            "_v",
            Date.now()
          );

          window.location.replace(
            url.toString()
          );

        }

      }

      catch (erro) {

        console.error(
          "Erro ao atualizar versão da página:",
          erro
        );

      }

    })();

  </script>

              "email",

        if (
          consultaUsuario.error

          throw consultaUsuario.error;

        }

        if (

          await supabaseClient.auth.signOut();

    function esconderMensagem() {

      const elemento =
        document.getElementById(
          "mensagem"
        );

      if (elemento) {

        elemento.textContent =
          "";

        elemento.className =
          "mensagem";

        elemento.style.display =
          "none";

      }

    }

    function normalizarTexto(
      valor
    ) {

      return String(
        valor || ""
      )
        .normalize(
          "NFD"
        )
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .trim()
        .toUpperCase();

    }

    function escapeHTML(
      valor
    ) {

      return String(
        valor ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

    function obterMensagemErro(
      erro
    ) {

      if (
        erro &&
        erro.message
      ) {

        const mensagem =
          String(
            erro.message
          );

        const texto =
          mensagem.toLowerCase();

        if (
          texto.includes(
            "duplicate"
          ) ||
          texto.includes(
            "unique"
          )
        ) {

          return (
            "ESTA NF JÁ ESTÁ CADASTRADA."
          );

        }

        if (
          texto.includes(
            "row-level security"
          ) ||
          texto.includes(
            "permission denied"
          )
        ) {

          return (
            "VOCÊ NÃO POSSUI PERMISSÃO PARA CADASTRAR ENVIOS."
          );

        }

        if (
          texto.includes(
            "column"
          ) &&
          texto.includes(
            "does not exist"
          )
        ) {

          return (
            "UMA DAS COLUNAS UTILIZADAS PELO SISTEMA NÃO EXISTE NO BANCO DE DADOS: " +
            mensagem.toUpperCase()
          );

        }

        if (
          texto.includes(
            "relation"
          ) &&
          texto.includes(
            "does not exist"
          )
        ) {

          return (
            'A TABELA "ENVIOS" NÃO FOI ENCONTRADA NO SUPABASE.'
          );

        }

        return mensagem.toUpperCase();

      }

      return (
        "NÃO FOI POSSÍVEL CONCLUIR A OPERAÇÃO."
      );

    }

    document.addEventListener(
      "click",
      function(evento) {

        const campo =
          document.getElementById(
            "clientePesquisa"
          );

        const resultados =
          document.getElementById(
            "resultadosClientes"
          );

        if (
          campo &&
          resultados &&
          !campo.contains(
            evento.target
          ) &&
          !resultados.contains(
            evento.target
          )
        ) {

          resultados.style.display =
            "none";

        }

      }
    );

    document.addEventListener(
      "input",
      function(evento) {

        const elemento =
          evento.target;

        if (
          elemento &&
          elemento.tagName ===
          "INPUT" &&
          elemento.type ===
          "text"
        ) {

          elemento.value =
            elemento.value.toUpperCase();

        }

        if (
          elemento &&
          elemento.tagName ===
          "TEXTAREA"
        ) {

          elemento.value =
            elemento.value.toUpperCase();

        }

      }
    );

    document
      .getElementById("nf")
      .addEventListener(
        "keydown",
        function(evento) {

          if (
            evento.key ===
            "Enter"
          ) {

            evento.preventDefault();

            document
              .getElementById(
                "clientePesquisa"
              )
              .focus();

          }

        }
      );

    supabaseClient.auth.onAuthStateChange(
      function(
        evento,
        session
      ) {

        if (
          evento ===
          "SIGNED_OUT"
        ) {

          redirecionarLogin();

        }

      }
    );

    async function sair() {

      const confirmar =
        window.confirm(
          "DESEJA REALMENTE SAIR DO BIRILOG?"
        );

      if (!confirmar) {

        return;

      }

      const botao =
        document.getElementById(
          "botaoSair"
        );

      if (botao) {

        botao.disabled =
          true;

        botao.textContent =
          "SAINDO...";

      }

      try {

        await supabaseClient.auth.signOut();

      }

      catch (erro) {

        console.error(
          "Erro ao sair:",
          erro
        );

      }

      redirecionarLogin();

    }

  </script>
