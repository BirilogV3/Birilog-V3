<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BiriLog V3 - Envios</title>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #1e293b;

    }


    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {

      width: 250px;

      height: 100vh;

      background:
        linear-gradient(
          180deg,
          #0f172a,
          #172554
        );

      color: white;

      position: fixed;

      left: 0;
      top: 0;
      bottom: 0;

      display: flex;

      flex-direction: column;

      z-index: 100;

      box-shadow:
        5px 0 20px
        rgba(0,0,0,0.10);

      overflow: hidden;

    }


    /* =====================================================
       LOGO
       ===================================================== */

    .logo-area {

      padding: 28px 22px;

      border-bottom:
        1px solid
        rgba(255,255,255,0.08);

      text-align: center;

      flex-shrink: 0;

    }


    .logo-icon {

      width: 58px;
      height: 58px;

      margin: 0 auto 12px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #1976d2,
          #0d47a1
        );

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 28px;

      box-shadow:
        0 8px 20px
        rgba(25,118,210,0.30);

    }


    .logo-title {

      font-size: 22px;

      font-weight: 800;

    }


    .logo-title span {

      color: #60a5fa;

    }


    .logo-version {

      margin-top: 5px;

      font-size: 10px;

      color: #94a3b8;

      letter-spacing: 1px;

    }


    /* =====================================================
       MENU
       ===================================================== */

    .menu {

      padding: 20px 12px;

      flex: 1;

      min-height: 0;

      overflow-y: auto;

    }


    .menu-title {

      padding:
        0 12px 10px;

      font-size: 10px;

      font-weight: 700;

      color: #64748b;

      letter-spacing: 1px;

    }


    .menu-item {

      width: 100%;

      border: none;

      background: transparent;

      color: #cbd5e1;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 13px 14px;

      margin-bottom: 4px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 13px;

      text-align: left;

      transition:
        background 0.2s,
        color 0.2s,
        transform 0.2s;

    }


    .menu-item:hover {

      background:
        rgba(255,255,255,0.08);

      color: white;

    }


    .menu-item:active {

      transform:
        scale(0.99);

    }


    .menu-item.active {

      background:
        linear-gradient(
          135deg,
          #1976d2,
          #2563eb
        );

      color: white;

      box-shadow:
        0 5px 15px
        rgba(37,99,235,0.25);

    }


    .menu-icon {

      width: 22px;

      text-align: center;

      font-size: 17px;

      flex-shrink: 0;

    }


    /* =====================================================
       USUÁRIO
       ===================================================== */

    .user-area {

      padding: 15px;

      border-top:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(0,0,0,0.08);

      flex-shrink: 0;

    }


    .user-card {

      background:
        rgba(255,255,255,0.06);

      border-radius: 10px;

      padding: 12px;

    }


    .user-name {

      font-size: 12px;

      font-weight: 700;

      color: white;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .user-email {

      margin-top: 3px;

      font-size: 9px;

      color: #94a3b8;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .user-profile {

      margin-top: 6px;

      font-size: 10px;

      color: #60a5fa;

      text-transform: uppercase;

      font-weight: 700;

    }


    /* =====================================================
       BOTÃO SAIR
       ===================================================== */

    .logout {

      width: 100%;

      display: block;

      visibility: visible;

      opacity: 1;

      position: relative;

      z-index: 1000;

      pointer-events: auto;

      margin-top: 10px;

      border:
        1px solid
        rgba(255,255,255,0.18);

      background:
        rgba(255,255,255,0.07);

      color: #e2e8f0;

      padding: 11px 10px;

      min-height: 40px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 11px;

      font-weight: 700;

      transition:
        background 0.2s,
        border-color 0.2s,
        color 0.2s,
        transform 0.2s;

    }


    .logout:hover {

      background: #dc2626;

      border-color: #dc2626;

      color: white;

    }


    .logout:active {

      transform:
        scale(0.98);

    }


    .logout:disabled {

      opacity: 0.60;

      cursor: wait;

    }


    /* =====================================================
       MAIN
       ===================================================== */

    .main {

      margin-left: 250px;

      width:
        calc(100% - 250px);

      min-height: 100vh;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      height: 75px;

      background: white;

      border-bottom:
        1px solid #e2e8f0;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 30px;

      position: sticky;

      top: 0;

      z-index: 50;

    }


    .header-title {

      font-size: 20px;

      font-weight: 800;

      color: #0f172a;

    }


    .header-subtitle {

      margin-top: 3px;

      font-size: 11px;

      color: #64748b;

    }


    .status-online {

      display: flex;

      align-items: center;

      gap: 7px;

      padding:
        7px 12px;

      border-radius: 20px;

      background: #f0fdf4;

      color: #15803d;

      font-size: 11px;

      font-weight: 700;

    }


    .status-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #22c55e;

    }


    /* =====================================================
       CONTEÚDO
       ===================================================== */

    .content {

      padding: 30px;

    }


    .page-title {

      margin-bottom: 22px;

    }


    .page-title h1 {

      font-size: 18px;

      font-weight: 800;

      color: #0f172a;

    }


    .page-title p {

      margin-top: 5px;

      font-size: 11px;

      color: #64748b;

    }


    /* =====================================================
       MENSAGEM
       ===================================================== */

    .mensagem {

      display: none;

      margin-bottom: 20px;

      padding: 13px 16px;

      border-radius: 9px;

      font-size: 11px;

      font-weight: 700;

      text-align: center;

    }


    .mensagem.sucesso {

      display: block;

      background: #f0fdf4;

      color: #15803d;

      border:
        1px solid #bbf7d0;

    }


    .mensagem.erro {

      display: block;

      background: #fef2f2;

      color: #b91c1c;

      border:
        1px solid #fecaca;

    }


    .mensagem.info {

      display: block;

      background: #eff6ff;

      color: #1d4ed8;

      border:
        1px solid #bfdbfe;

    }


    /* =====================================================
       CARDS
       ===================================================== */

    .cards {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

      margin-bottom: 22px;

    }


    .card {

      background: white;

      border:
        1px solid #e2e8f0;

      border-radius: 14px;

      padding: 20px;

      box-shadow:
        0 4px 15px
        rgba(15,23,42,0.04);

    }


    .card-label {

      font-size: 10px;

      color: #64748b;

      font-weight: 700;

      text-transform: uppercase;

    }


    .card-value {

      margin-top: 8px;

      font-size: 28px;

      font-weight: 800;

      color: #0f172a;

    }


    /* =====================================================
       PAINEL
       ===================================================== */

    .panel {

      background: white;

      border:
        1px solid #e2e8f0;

      border-radius: 14px;

      padding: 22px;

      box-shadow:
        0 4px 15px
        rgba(15,23,42,0.04);

      margin-bottom: 20px;

    }


    .panel-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;

    }


    .panel-title {

      font-size: 15px;

      font-weight: 800;

      color: #0f172a;

    }


    .panel-subtitle {

      margin-top: 4px;

      font-size: 10px;

      color: #94a3b8;

    }


    /* =====================================================
       FILTROS
       ===================================================== */

    .toolbar {

      display: grid;

      grid-template-columns:
        2fr 1fr auto auto;

      gap: 10px;

      margin-bottom: 20px;

    }


    .toolbar input,
    .toolbar select {

      width: 100%;

      height: 42px;

      padding:
        0 12px;

      border:
        1px solid #cbd5e1;

      border-radius: 8px;

      background: #f8fafc;

      color: #334155;

      outline: none;

      font-size: 11px;

    }


    .toolbar input:focus,
    .toolbar select:focus {

      background: white;

      border-color: #1976d2;

      box-shadow:
        0 0 0 3px
        rgba(25,118,210,0.10);

    }


    /* =====================================================
       BOTÕES
       ===================================================== */

    .btn {

      border: none;

      border-radius: 8px;

      padding:
        10px 15px;

      cursor: pointer;

      font-size: 11px;

      font-weight: 800;

      transition:
        0.2s;

      white-space: nowrap;

    }


    .btn:hover {

      transform:
        translateY(-1px);

    }


    .btn-primary {

      background:
        linear-gradient(
          135deg,
          #1976d2,
          #2563eb
        );

      color: white;

      box-shadow:
        0 5px 14px
        rgba(37,99,235,0.20);

    }


    .btn-secondary {

      background: #f1f5f9;

      color: #475569;

      border:
        1px solid #e2e8f0;

    }


    /* =====================================================
       TABELA
       ===================================================== */

    .table-wrapper {

      width: 100%;

      overflow-x: auto;

    }


    table {

      width: 100%;

      min-width: 1000px;

      border-collapse: collapse;

    }


    th {

      padding:
        11px 8px;

      text-align: center;

      background: #0f172a;

      color: white;

      font-size: 9px;

      text-transform: uppercase;

      white-space: nowrap;

    }


    td {

      padding:
        11px 8px;

      border-bottom:
        1px solid #f1f5f9;

      font-size: 10px;

      color: #334155;

      text-align: center;

      white-space: nowrap;

    }


    tbody tr:hover td {

      background: #f8fafc;

    }


    .nf {

      font-weight: 800;

      color: #1976d2;

    }


    .transportadora {

      font-weight: 700;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {

      display: inline-block;

      padding:
        5px 9px;

      border-radius: 20px;

      font-size: 8px;

      font-weight: 800;

      color: white;

      text-transform: uppercase;

      white-space: nowrap;

    }


    .coletado {

      background: #1565C0;

    }


    .transito {

      background: #FF9800;

    }


    .entregue {

      background: #4CAF50;

    }


    .atrasado {

      background: #E53935;

    }


    .padrao {

      background: #64748b;

    }


    /* =====================================================
       AÇÕES
       ===================================================== */

    .acoes {

      display: flex;

      justify-content: center;

      gap: 5px;

    }


    .btn-mini {

      border: none;

      border-radius: 6px;

      padding:
        6px 8px;

      cursor: pointer;

      font-size: 9px;

      font-weight: 700;

    }


    .btn-ver {

      background: #dbeafe;

      color: #1d4ed8;

    }


    .btn-editar {

      background: #fef3c7;

      color: #92400e;

    }


    .btn-excluir {

      background: #fee2e2;

      color: #b91c1c;

    }


    /* =====================================================
       VAZIO / CARREGANDO
       ===================================================== */

    .carregando,
    .vazio,
    .erro-tabela {

      padding:
        30px;

      font-weight: 700;

      text-align: center;

    }


    .carregando,
    .vazio {

      color: #64748b;

    }


    .erro-tabela {

      color: #dc2626;

    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading {

      position: fixed;

      inset: 0;

      background:
        rgba(248,250,252,0.88);

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 9999;

      backdrop-filter: blur(2px);

    }


    .loading-box {

      background: white;

      border-radius: 14px;

      padding:
        25px 30px;

      text-align: center;

      box-shadow:
        0 20px 50px
        rgba(15,23,42,0.18);

    }


    .spinner {

      width: 35px;

      height: 35px;

      margin:
        0 auto 12px;

      border:
        3px solid #dbeafe;

      border-top-color:
        #1976d2;

      border-radius: 50%;

      animation:
        girar .8s linear infinite;

    }


    .loading-text {

      font-size: 11px;

      color: #64748b;

      font-weight: 700;

    }


    @keyframes girar {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* =====================================================
       RESPONSIVO
       ===================================================== */

    @media (max-width: 1100px) {

      .cards {

        grid-template-columns:
          repeat(2, 1fr);

      }


      .toolbar {

        grid-template-columns:
          1fr 1fr;

      }

    }


    @media (max-width: 700px) {

      .sidebar {

        width: 70px;

      }


      .logo-title,
      .logo-version,
      .menu-title,
      .menu-item span:not(.menu-icon),
      .user-card {

        display: none;

      }


      .logo-area {

        padding:
          18px 8px;

      }


      .logo-icon {

        width: 42px;
        height: 42px;

        font-size: 20px;

      }


      .menu {

        padding:
          15px 8px;

      }


      .menu-item {

        justify-content: center;

        padding:
          13px 5px;

      }


      .user-area {

        padding:
          10px 8px;

      }


      .logout {

        font-size: 0;

        padding:
          12px 5px;

        min-height: 42px;

      }


      .logout::before {

        content: "🚪";

        font-size: 17px;

      }


      .main {

        margin-left: 70px;

        width:
          calc(100% - 70px);

      }


      .header {

        padding:
          0 18px;

      }


      .header-title {

        font-size: 17px;

      }


      .status-online {

        font-size: 0;

        padding: 9px;

      }


      .status-dot {

        width: 8px;
        height: 8px;

      }


      .content {

        padding: 18px;

      }


      .cards {

        grid-template-columns:
          1fr;

      }


      .toolbar {

        grid-template-columns:
          1fr;

      }


      .toolbar .btn {

        width: 100%;

      }


      .panel {

        padding: 18px;

      }

    }


    @media (max-width: 450px) {

      .header-subtitle {

        display: none;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    id="loadingTela"
    class="loading"
  >

    <div class="loading-box">

      <div class="spinner"></div>

      <div
        id="loadingText"
        class="loading-text"
      >
        CARREGANDO...
      </div>

    </div>

  </div>


  <!-- =====================================================
       SIDEBAR
       ===================================================== -->

  <aside class="sidebar">


    <!-- LOGO -->

    <div class="logo-area">

      <div class="logo-icon">
        🚚
      </div>

      <div class="logo-title">
        Biri<span>Log</span>
      </div>

      <div class="logo-version">
        SISTEMA V3.0
      </div>

    </div>


    <!-- MENU -->

    <nav class="menu">

      <div class="menu-title">
        MENU PRINCIPAL
      </div>


      <!-- DASHBOARD -->

      <button
        type="button"
        class="menu-item"
        onclick="irPara('dashboard.html')"
      >

        <span class="menu-icon">
          📊
        </span>

        <span>
          Dashboard
        </span>

      </button>


      <!-- ENVIOS -->

      <button
        type="button"
        class="menu-item active"
        onclick="irPara('envios.html')"
      >

        <span class="menu-icon">
          📦
        </span>

        <span>
          Envios
        </span>

      </button>


      <!-- PESQUISAR NF -->

      <button
        type="button"
        class="menu-item"
        onclick="irPara('pesquisar-nf.html')"
      >

        <span class="menu-icon">
          🔎
        </span>

        <span>
          Pesquisar NF
        </span>

      </button>


      <!-- CLIENTES -->

      <button
        type="button"
        class="menu-item"
        onclick="irPara('clientes.html')"
      >

        <span class="menu-icon">
          👥
        </span>

        <span>
          Clientes
        </span>

      </button>


      <!-- TRANSPORTADORAS -->

      <button
        type="button"
        class="menu-item"
        onclick="irPara('transportadoras.html')"
      >

        <span class="menu-icon">
          🚛
        </span>

        <span>
          Transportadoras
        </span>

      </button>


      <!-- RELATÓRIOS -->

      <button
        type="button"
        class="menu-item"
        onclick="irPara('relatorios.html')"
      >

        <span class="menu-icon">
          📄
        </span>

        <span>
          Relatórios
        </span>

      </button>


      <!-- USUÁRIOS -->

      <button
        type="button"
        class="menu-item"
        onclick="irPara('usuarios.html')"
      >

        <span class="menu-icon">
          🔐
        </span>

        <span>
          Usuários
        </span>

      </button>


      <!-- CONFIGURAÇÕES -->

      <button
        type="button"
        class="menu-item"
        onclick="irPara('configuracoes.html')"
      >

        <span class="menu-icon">
          ⚙️
        </span>

        <span>
          Configurações
        </span>

      </button>


    </nav>


    <!-- =================================================
         USUÁRIO
         ================================================= -->

    <div class="user-area">

      <div class="user-card">

        <div
          id="usuarioNome"
          class="user-name"
        >
          USUÁRIO
        </div>


        <div
          id="usuarioEmail"
          class="user-email"
        >
          -
        </div>


        <div
          id="usuarioPerfil"
          class="user-profile"
        >
          PERFIL
        </div>

      </div>


      <!-- BOTÃO SAIR -->

      <button
        type="button"
        class="logout"
        id="botaoSair"
        onclick="sair()"
      >

        🚪 SAIR DO SISTEMA

      </button>

    </div>


  </aside>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="main">


    <header class="header">

      <div>

        <div class="header-title">
          Envios
        </div>

        <div class="header-subtitle">
          Acompanhamento e gerenciamento dos envios
        </div>

      </div>


      <div class="status-online">

        <span class="status-dot"></span>

        SISTEMA ONLINE

      </div>

    </header>


    <section class="content">


      <!-- =================================================
           MENSAGEM
           ================================================= -->

      <div
        id="mensagem"
        class="mensagem"
      ></div>


      <!-- =================================================
           TÍTULO
           ================================================= -->

      <div class="page-title">

        <h1>
          📦 LISTA DE ENVIOS
        </h1>

        <p>
          ACOMPANHAMENTO E GERENCIAMENTO DOS ENVIOS
        </p>

      </div>


      <!-- =================================================
           PAINEL
           ================================================= -->

      <div class="panel">


        <!-- FILTROS -->

        <div class="toolbar">


          <input
            type="text"
            id="pesquisa"
            placeholder="PESQUISAR NF, CLIENTE, CIDADE..."
            autocomplete="off"
          >


          <select
            id="status"
          >

            <option value="">
              TODOS OS STATUS
            </option>

            <option value="COLETADO">
              COLETADO
            </option>

            <option value="EM TRANSITO">
              EM TRANSITO
            </option>

            <option value="ENTREGUE">
              ENTREGUE
            </option>

            <option value="ATRASADO">
              ATRASADO
            </option>

          </select>


          <button
            type="button"
            class="btn btn-primary"
            onclick="filtrar()"
          >

            🔎 PESQUISAR

          </button>


          <button
            type="button"
            class="btn btn-secondary"
            onclick="carregarEnvios()"
          >

            🔄 ATUALIZAR

          </button>


        </div>


        <!-- CONTADOR -->

        <div
          id="contador"
          style="
            display:inline-block;
            background:#e3f2fd;
            color:#1565C0;
            padding:7px 12px;
            border-radius:20px;
            font-size:11px;
            font-weight:bold;
            margin-bottom:15px;
          "
        >

          0 ENVIOS

        </div>


        <!-- =================================================
             TABELA
             ================================================= -->

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>
                  NF
                </th>

                <th>
                  CLIENTE
                </th>

                <th>
                  CIDADE
                </th>

                <th>
                  UF
                </th>

                <th>
                  TRANSPORTADORA
                </th>

                <th>
                  STATUS
                </th>

                <th>
                  VOLUMES
                </th>

                <th>
                  PESO
                </th>

                <th>

                </th>

              </tr>

            </thead>


            <tbody
              id="tabelaEnvios"
            >

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://sjfwjwwkomrcalahqanw.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_WpXZ79UY0pOqbbpFmJDcdQ_wkYQZLZC";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       VARIÁVEIS
       ===================================================== */

    let usuarioAtual =
      null;


    let envios =
      [];


    /* =====================================================
       INICIALIZAÇÃO
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      iniciar
    );


    async function iniciar() {

      try {

        mostrarLoading(
          "VERIFICANDO SESSÃO..."
        );


        const resultadoSessao =
          await supabaseClient.auth.getSession();


        if (
          resultadoSessao.error
        ) {

          throw resultadoSessao.error;

        }


        const session =
          resultadoSessao.data &&
          resultadoSessao.data.session;


        if (!session) {

          redirecionarLogin();

          return;

        }


        const authUser =
          session.user;


        /* ==============================================
           USUÁRIO BIRILOG
           ============================================== */

        const consulta =
          await supabaseClient

            .from("usuarios")

            .select(
              "id,nome,email,perfil,ativo"
            )

            .eq(
              "auth_id",
              authUser.id
            )

            .maybeSingle();


        if (
          consulta.error
        ) {

          throw consulta.error;

        }


        if (
          !consulta.data
        ) {

          await supabaseClient.auth.signOut();

          redirecionarLogin();

          return;

        }


        if (
          consulta.data.ativo === false
        ) {

          await supabaseClient.auth.signOut();

          redirecionarLogin();

          return;

        }


        usuarioAtual =
          consulta.data;


        preencherUsuario();


        esconderLoading();


        await carregarEnvios();

      }


      catch (erro) {

        console.error(
          "Erro ao iniciar Envios:",
          erro
        );


        esconderLoading();


        mostrarMensagem(
          "NÃO FOI POSSÍVEL CARREGAR O MÓDULO DE ENVIOS.",
          "erro"
        );

      }

    }


    /* =====================================================
       USUÁRIO
       ===================================================== */

    function preencherUsuario() {

      if (!usuarioAtual) {

        return;

      }


      document.getElementById(
        "usuarioNome"
      ).textContent =
        String(
          usuarioAtual.nome ||
          usuarioAtual.email ||
          "USUÁRIO"
        ).toUpperCase();


      document.getElementById(
        "usuarioEmail"
      ).textContent =
        usuarioAtual.email ||
        "-";


      document.getElementById(
        "usuarioPerfil"
      ).textContent =
        String(
          usuarioAtual.perfil ||
          "USUÁRIO"
        ).toUpperCase();

    }


    /* =====================================================
       CARREGAR ENVIOS
       ===================================================== */

    async function carregarEnvios() {

      const tabela =
        document.getElementById(
          "tabelaEnvios"
        );


      mostrarLoading(
        "CARREGANDO ENVIOS..."
      );


      tabela.innerHTML =
        `
          <tr>
            <td colspan="9" class="carregando">
              🔄 CARREGANDO ENVIOS...
            </td>
          </tr>
        `;


      try {

        const resultado =
          await supabaseClient

            .from("envios")

            .select("*")

            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (
          resultado.error
        ) {

          throw resultado.error;

        }


        envios =
          resultado.data || [];


        desenharTabela(
          envios
        );

      }


      catch (erro) {

        console.error(
          "Erro ao carregar envios:",
          erro
        );


        envios =
          [];


        tabela.innerHTML =
          `
            <tr>
              <td colspan="9" class="erro-tabela">
                ❌ ERRO AO CARREGAR OS ENVIOS.
              </td>
            </tr>
          `;


        mostrarMensagem(
          obterMensagemErro(
            erro
          ),
          "erro"
        );

      }


      finally {

        esconderLoading();

      }

    }


    /* =====================================================
       DESENHAR TABELA
       ===================================================== */

    function desenharTabela(
      lista
    ) {

      const tabela =
        document.getElementById(
          "tabelaEnvios"
        );


      const contador =
        document.getElementById(
          "contador"
        );


      contador.textContent =
        lista.length +
        (
          lista.length === 1
            ? " ENVIO"
            : " ENVIOS"
        );


      tabela.innerHTML =
        "";


      if (
        lista.length === 0
      ) {

        tabela.innerHTML =
          `
            <tr>
              <td colspan="9" class="vazio">
                📭 NENHUM ENVIO ENCONTRADO.
              </td>
            </tr>
          `;

        return;

      }


      lista.forEach(
        function(item) {


          const nf =
            item.nf ??
            "";


          const cliente =
            item.cliente ||
            "";


          const cidade =
            item.cidade ||
            "";


          const uf =
            item.uf ||
            "";


          const transportadora =
            item.transportadora ||
            "";


          const peso =
            Number(
              item.peso ||
              0
            );


          const volumes =
            item.volumes ??
            0;


          const status =
            normalizarStatus(
              item.status ||
              "COLETADO"
            );


          let classeStatus =
            "padrao";


          if (
            status ===
            "COLETADO"
          ) {

            classeStatus =
              "coletado";

          }


          else if (
            status ===
            "EM TRANSITO"
          ) {

            classeStatus =
              "transito";

          }


          else if (
            status ===
            "ENTREGUE"
          ) {

            classeStatus =
              "entregue";

          }


          else if (
            status ===
            "ATRASADO"
          ) {

            classeStatus =
              "atrasado";

          }


          const tr =
            document.createElement(
              "tr"
            );


          /* NF */

          const tdNF =
            document.createElement(
              "td"
            );


          tdNF.className =
            "nf";


          tdNF.textContent =
            nf;


          tr.appendChild(
            tdNF
          );


          /* CLIENTE */

          const tdCliente =
            document.createElement(
              "td"
            );


          tdCliente.textContent =
            cliente;


          tr.appendChild(
            tdCliente
          );


          /* CIDADE */

          const tdCidade =
            document.createElement(
              "td"
            );


          tdCidade.textContent =
            cidade;


          tr.appendChild(
            tdCidade
          );


          /* UF */

          const tdUF =
            document.createElement(
              "td"
            );


          tdUF.textContent =
            uf;


          tr.appendChild(
            tdUF
          );


          /* TRANSPORTADORA */

          const tdTransportadora =
            document.createElement(
              "td"
            );


          tdTransportadora.className =
            "transportadora";


          tdTransportadora.textContent =
            transportadora;


          tr.appendChild(
            tdTransportadora
          );


          /* STATUS */

          const tdStatus =
            document.createElement(
              "td"
            );


          const spanStatus =
            document.createElement(
              "span"
            );


          spanStatus.className =
            "status " +
            classeStatus;


          spanStatus.textContent =
            status;


          tdStatus.appendChild(
            spanStatus
          );


          tr.appendChild(
            tdStatus
          );


          /* VOLUMES */

          const tdVolumes =
            document.createElement(
              "td"
            );


          tdVolumes.textContent =
            volumes;


          tr.appendChild(
            tdVolumes
          );


          /* PESO */

          const tdPeso =
            document.createElement(
              "td"
            );


          tdPeso.textContent =
            peso.toFixed(2) +
            " KG";


          tr.appendChild(
            tdPeso
          );


          /* AÇÕES */

          const tdAcoes =
            document.createElement(
              "td"
            );


          const divAcoes =
            document.createElement(
              "div"
            );


          divAcoes.className =
            "acoes";


          /* VER */

          const btnVer =
            document.createElement(
              "button"
            );


          btnVer.type =
            "button";


          btnVer.className =
            "btn-mini btn-ver";


          btnVer.textContent =
            "👁";


          btnVer.title =
            "VER";


          btnVer.onclick =
            function() {

              visualizarEnvio(
                item
              );

            };


          /* EDITAR */

          const btnEditar =
            document.createElement(
              "button"
            );


          btnEditar.type =
            "button";


          btnEditar.className =
            "btn-mini btn-editar";


          btnEditar.textContent =
            "✏️";


          btnEditar.title =
            "EDITAR";


          btnEditar.onclick =
            function() {

              editarEnvio(
                nf
              );

            };


          /* EXCLUIR */

          const btnExcluir =
            document.createElement(
              "button"
            );


          btnExcluir.type =
            "button";


          btnExcluir.className =
            "btn-mini btn-excluir";


          btnExcluir.textContent =
            "🗑️";


          btnExcluir.title =
            "EXCLUIR";


          btnExcluir.onclick =
            function() {

              excluirEnvio(
                nf
              );

            };


          divAcoes.appendChild(
            btnVer
          );


          divAcoes.appendChild(
            btnEditar
          );


          divAcoes.appendChild(
            btnExcluir
          );


          tdAcoes.appendChild(
            divAcoes
          );


          tr.appendChild(
            tdAcoes
          );


          tabela.appendChild(
            tr
          );

        }
      );

    }


    /* =====================================================
       FILTRAR
       ===================================================== */

    function filtrar() {

      const texto =
        normalizarTexto(
          document.getElementById(
            "pesquisa"
          ).value
        );


      const statusSelecionado =
        normalizarStatus(
          document.getElementById(
            "status"
          ).value
        );


      const filtrado =
        envios.filter(
          function(item) {


            const textoLinha =
              normalizarTexto(

                String(
                  item.nf ||
                  ""
                ) +
                " " +
                String(
                  item.cliente ||
                  ""
                ) +
                " " +
                String(
                  item.cidade ||
                  ""
                ) +
                " " +
                String(
                  item.uf ||
                  ""
                ) +
                " " +
                String(
                  item.transportadora ||
                  ""
                )

              );


            const textoOK =
              !texto ||
              textoLinha.includes(
                texto
              );


            const statusAtual =
              normalizarStatus(
                item.status
              );


            const statusOK =
              !statusSelecionado ||
              statusAtual ===
              statusSelecionado;


            return (
              textoOK &&
              statusOK
            );

          }
        );


      desenharTabela(
        filtrado
      );

    }


    /* =====================================================
       VER ENVIO
       ===================================================== */

    function visualizarEnvio(
      item
    ) {

      const nf =
        item.nf ||
        "";


      const cliente =
        item.cliente ||
        "";


      const cidade =
        item.cidade ||
        "";


      const uf =
        item.uf ||
        "";


      const transportadora =
        item.transportadora ||
        "";


      const valor =
        Number(
          item.valor ||
          0
        ).toLocaleString(
          "pt-BR",
          {
            style:
              "currency",
            currency:
              "BRL"
          }
        );


      const peso =
        Number(
          item.peso ||
          0
        ).toFixed(2);


      const volumes =
        item.volumes ||
        0;


      const status =
        normalizarStatus(
          item.status
        );


      const observacao =
        item.observacao ||
        "";


      alert(

        "NF: " +
        nf +

        "\n\nCLIENTE: " +
        cliente +

        "\nCIDADE: " +
        cidade +
        " - " +
        uf +

        "\nTRANSPORTADORA: " +
        transportadora +

        "\n\nVALOR: " +
        valor +

        "\nVOLUMES: " +
        volumes +

        "\nPESO: " +
        peso +
        " KG" +

        "\n\nSTATUS: " +
        status +

        "\n\nOBSERVAÇÃO: " +
        observacao

      );

    }


    /* =====================================================
       EDITAR
       ===================================================== */

    function editarEnvio(
      nf
    ) {

      alert(

        "A EDIÇÃO DA NF SERÁ REALIZADA PELO MÓDULO ATUALIZAR NF.\n\n" +
        "NF: " +
        nf

      );

    }


    /* =====================================================
       EXCLUIR
       ===================================================== */

    async function excluirEnvio(
      nf
    ) {

      const confirmar =
        window.confirm(
          "DESEJA REALMENTE EXCLUIR A NF " +
          nf +
          "?"
        );


      if (!confirmar) {

        return;

      }


      try {

        mostrarLoading(
          "EXCLUINDO ENVIO..."
        );


        const resultado =
          await supabaseClient

            .from("envios")

            .delete()

            .eq(
              "nf",
              nf
            );


        if (
          resultado.error
        ) {

          throw resultado.error;

        }


        mostrarMensagem(
          "NF " +
          nf +
          " EXCLUÍDA COM SUCESSO.",
          "sucesso"
        );


        await carregarEnvios();

      }


      catch (erro) {

        console.error(
          "Erro ao excluir:",
          erro
        );


        mostrarMensagem(
          obterMensagemErro(
            erro
          ),
          "erro"
        );

      }


      finally {

        esconderLoading();

      }

    }


    /* =====================================================
       NORMALIZAR TEXTO
       ===================================================== */

    function normalizarTexto(
      valor
    ) {

      return String(
        valor ||
        ""
      )
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .trim()
        .toUpperCase();

    }


    /* =====================================================
       NORMALIZAR STATUS
       ===================================================== */

    function normalizarStatus(
      valor
    ) {

      return String(
        valor ||
        ""
      )
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .trim()
        .toUpperCase();

    }


    /* =====================================================
       NAVEGAÇÃO
       ===================================================== */

    function irPara(
      pagina
    ) {

      if (!pagina) {

        return;

      }


      window.location.href =
        pagina;

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    function redirecionarLogin() {

      window.location.replace(
        "index.html"
      );

    }


    /* =====================================================
       LOADING
       ===================================================== */

    function mostrarLoading(
      texto
    ) {

      const elemento =
        document.getElementById(
          "loadingTela"
        );


      const textoElemento =
        document.getElementById(
          "loadingText"
        );


      if (textoElemento) {

        textoElemento.textContent =
          texto ||
          "CARREGANDO...";

      }


      if (elemento) {

        elemento.style.display =
          "flex";

      }

    }


    function esconderLoading() {

      const elemento =
        document.getElementById(
          "loadingTela"
        );


      if (elemento) {

        elemento.style.display =
          "none";

      }

    }


    /* =====================================================
       MENSAGEM
       ===================================================== */

    function mostrarMensagem(
      texto,
      tipo
    ) {

      const elemento =
        document.getElementById(
          "mensagem"
        );


      if (!elemento) {

        return;

      }


      elemento.textContent =
        texto;


      elemento.className =
        "mensagem " +
        tipo;


      elemento.style.display =
        "block";


      clearTimeout(
        window.timerMensagem
      );


      window.timerMensagem =
        setTimeout(
          function() {

            elemento.style.display =
              "none";

          },
          5000
        );

    }


    /* =====================================================
       ERROS
       ===================================================== */

    function obterMensagemErro(
      erro
    ) {

      if (
        erro &&
        erro.message
      ) {

        const mensagem =
          String(
            erro.message
          );


        const texto =
          mensagem.toLowerCase();


        if (
          texto.includes(
            "row-level security"
          ) ||
          texto.includes(
            "permission denied"
          )
        ) {

          return (
            "VOCÊ NÃO POSSUI PERMISSÃO PARA REALIZAR ESTA OPERAÇÃO."
          );

        }


        return mensagem.toUpperCase();

      }


      return (
        "NÃO FOI POSSÍVEL CONCLUIR A OPERAÇÃO."
      );

    }


    /* =====================================================
       ENTER NA PESQUISA
       ===================================================== */

    document
      .getElementById(
        "pesquisa"
      )
      .addEventListener(
        "keydown",
        function(evento) {

          if (
            evento.key ===
            "Enter"
          ) {

            evento.preventDefault();

            filtrar();

          }

        }
      );


    /* =====================================================
       MONITORAR SESSÃO
       ===================================================== */

    supabaseClient.auth.onAuthStateChange(
      function(
        evento,
        session
      ) {

        if (
          evento ===
          "SIGNED_OUT"
        ) {

          redirecionarLogin();

        }

      }
    );


    /* =====================================================
       SAIR DO SISTEMA
       ===================================================== */

    async function sair() {

      const confirmar =
        window.confirm(
          "DESEJA REALMENTE SAIR DO BIRILOG?"
        );


      if (!confirmar) {

        return;

      }


      const botao =
        document.getElementById(
          "botaoSair"
        );


      if (botao) {

        botao.disabled =
          true;

        botao.textContent =
          "SAINDO...";

      }


      try {

        const resultado =
          await supabaseClient.auth.signOut();


        if (
          resultado.error
        ) {

          console.error(
            "Erro ao sair:",
            resultado.error
          );

        }

      }

      catch (erro) {

        console.error(
          "Erro ao sair:",
          erro
        );

      }


      redirecionarLogin();

    }


  </script>
